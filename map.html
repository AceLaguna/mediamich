<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michigan Media Map — Michigan Media Hub</title>
<meta name="description" content="Interactive map of every Michigan media outlet — TV, radio, newspapers, magazines, and digital news.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root { --navy:#0c1f3a; --navy-mid:#1e3a5f; --gold:#c8860a; --blue:#185FA5; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* Navbar — styled to match the main site */
  #navbar { position: sticky; top: 0; z-index: 1000; background: rgba(12,31,58,0.96);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
  .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 1.25rem; height: 58px;
               display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .logo-btn { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--gold);
               display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-name { font-family: Georgia, 'Times New Roman', serif; color: #fff; font-size: .95rem; }
  .logo-sub { color: var(--gold); font-size: .6rem; letter-spacing: .18em;
              text-transform: uppercase; font-weight: 600; margin-top: 2px; }
  #desktop-nav { display: flex; align-items: center; gap: 2px; }
  .nav-btn { color: rgba(255,255,255,0.85); font-size: .875rem; font-weight: 500;
             padding: 6px 12px; border-radius: 8px; text-decoration: none;
             transition: background .15s, color .15s; white-space: nowrap; }
  .nav-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .nav-btn.active { background: rgba(255,255,255,0.16); color: #fff; font-weight: 600; }
  #stats { color: rgba(255,255,255,0.7); font-size: .8rem; white-space: nowrap; }
  @media (max-width: 760px) {
    #stats { display: none; }
    .logo-sub { display: none; }
    .nav-btn { padding: 6px 8px; font-size: .8rem; }
  }

  /* Filters + map */
  #filters { background: #f4f8fc; padding: 10px 20px; display: flex; flex-wrap: wrap;
             gap: 8px; border-bottom: 1px solid #d7e2ec; }
  .chip { border: 1.5px solid var(--blue); border-radius: 20px; padding: 5px 12px;
          font-size: .82rem; cursor: pointer; background: #fff; color: var(--navy);
          user-select: none; }
  .chip.on { background: var(--blue); color: #fff; }
  #map { height: calc(100vh - 118px); min-height: 480px; }

  /* Popups */
  .popup-name { font-weight: 700; color: var(--navy); font-size: 1rem; }
  .popup-meta { color: #5a6572; font-size: .8rem; margin: 3px 0; }
  .popup-desc { font-size: .84rem; margin: 5px 0; }
  .popup-link a { color: var(--blue); font-weight: 600; font-size: .85rem; }
  .badge { display: inline-block; font-size: .7rem; padding: 1px 7px; border-radius: 10px;
           background: #eee; color: #555; margin-left: 6px; }
</style>
</head>
<body>
<div id="navbar">
  <div class="nav-inner">
    <a class="logo-btn" href="index.html">
      <div class="logo-icon">📡</div>
      <div class="logo-text">
        <div class="logo-name">Michigan Media Hub</div>
        <div class="logo-sub">Media Map</div>
      </div>
    </a>
    <nav id="desktop-nav">
      <a class="nav-btn" href="index.html">Home</a>
      <a class="nav-btn" href="index.html#directory">Directory</a>
      <a class="nav-btn active" href="map.html">Map</a>
      <a class="nav-btn" href="frontpages.html">Front Pages</a>
      <a class="nav-btn" href="index.html#submit">Submit Outlet</a>
      <a class="nav-btn" href="index.html#about">About</a>
    </nav>
    <span id="stats">Loading…</span>
  </div>
</div>
<div id="filters"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const COLORS = {
  "TV": "#d9534f", "Radio": "#f0ad4e", "Daily": "#14385C", "Weekly": "#5bc0de",
  "Magazine": "#9b59b6", "Digital": "#2ecc71", "Public Media": "#e67e22",
  "Ethnic & Religious": "#c0392b", "University": "#16a085", "Business": "#7f8c8d",
  "Sports & Outdoors": "#27ae60", "Border & Cross-Border": "#a21caf"
};
const map = L.map("map").setView([44.3, -85.4], 6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  maxZoom: 19, subdomains: "abcd",
  attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
}).addTo(map);
const cluster = L.markerClusterGroup({ maxClusterRadius: 38, disableClusteringAtZoom: 9 });
map.addLayer(cluster);

let OUTLETS = [], active = new Set();

fetch("outlets.json")
  .then(r => r.json())
  .then(data => {
    OUTLETS = data.outlets.filter(o => o.lat && o.lng);
    data.categories.forEach(c => active.add(c));
    buildChips(data.categories);
    render();
  })
  .catch(() => {
    document.getElementById("stats").textContent =
      "Could not load outlets.json — make sure it sits in the same folder as this page.";
  });

function buildChips(cats) {
  const box = document.getElementById("filters");
  cats.forEach(c => {
    const el = document.createElement("span");
    el.className = "chip on";
    el.style.borderColor = COLORS[c] || "#185FA5";
    el.textContent = c;
    el.onclick = () => {
      active.has(c) ? active.delete(c) : active.add(c);
      el.classList.toggle("on");
      render();
    };
    box.appendChild(el);
  });
  const all = document.createElement("span");
  all.className = "chip"; all.textContent = "Toggle all";
  all.onclick = () => {
    const on = active.size === 0;
    active.clear();
    document.querySelectorAll("#filters .chip").forEach(ch => {
      if (ch === all) return;
      ch.classList.toggle("on", on);
      if (on) active.add(ch.textContent);
    });
    render();
  };
  box.appendChild(all);
}

function render() {
  cluster.clearLayers();
  let shown = 0;
  // spread markers that share identical city coordinates
  const seen = {};
  OUTLETS.forEach(o => {
    if (!active.has(o.category)) return;
    const key = o.lat + "," + o.lng;
    const n = (seen[key] = (seen[key] || 0) + 1);
    const angle = n * 2.4, r = 0.006 * Math.sqrt(n);
    const lat = o.lat + r * Math.sin(angle), lng = o.lng + r * Math.cos(angle);
    const m = L.circleMarker([lat, lng], {
      radius: 7, weight: 1.5, color: "#fff",
      fillColor: COLORS[o.category] || "#185FA5", fillOpacity: 0.92
    });
    const status = o.status && o.status !== "active"
      ? `<span class="badge">${o.status}</span>` : "";
    m.bindPopup(`
      <div class="popup-name">${o.name}${status}</div>
      <div class="popup-meta">${o.category} · ${o.city || ""}${o.market ? " · " + o.market : ""}</div>
      <div class="popup-desc">${o.description || ""}</div>
      <div class="popup-link"><a href="${o.website}" target="_blank" rel="noopener">Visit website →</a></div>`);
    cluster.addLayer(m);
    shown++;
  });
  document.getElementById("stats").textContent =
    `${shown} outlets shown · ${OUTLETS.length} total`;
}
</script>
</body>
</html>
