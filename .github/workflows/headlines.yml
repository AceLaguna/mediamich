name: Refresh headlines cache
on:
  schedule:
    - cron: "17 */6 * * *"    # every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - name: Build headlines.json
        run: python scripts/build_headlines.py
      - name: Commit the refreshed cache
        run: |
          git config user.name "headlines-bot"
          git config user.email "actions@github.com"
          git add headlines.json
          git diff --cached --quiet || git commit -m "Refresh headlines cache"
          git push
